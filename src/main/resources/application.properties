spring.application.name=gestionfioul
server.port=9999

# MongoDB du docker-compose.yml (mêmes variables et valeurs par défaut que le compose)
spring.mongodb.uri=mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:root}@localhost:${MONGO_PORT:27018}/gestionfioul?authSource=admin

# nécessaire pour l'index unique sur l'email des utilisateurs
spring.data.mongodb.auto-index-creation=true

# compte administrateur créé au démarrage ; sans mot de passe, aucun admin n'est créé
gestionfioul.admin.email=admin@gestionfioul.local
gestionfioul.admin.password=${ADMIN_PASSWORD:12345678}

# fréquence (en ms) à laquelle CampagneScheduler clôture les campagnes dont la date limite est dépassée
gestionfioul.campagnes.cloture-automatique.intervalle-ms=300000
