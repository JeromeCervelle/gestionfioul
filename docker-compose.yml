name: gestionfioul

# Pile MongoDB de développement : base + interface web.
# Ports hôte 27018 et 8083 pour ne pas entrer en conflit avec un autre MongoDB déjà lancé sur 27017/8081.
# Les valeurs ci-dessous sont modifiables par variables d'environnement (ou un fichier .env).

services:
  mongo:
    image: mongo:8.0.9
    container_name: gestionfioul-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"   # accessible uniquement depuis ce poste
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: gestionfioul-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-root}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8083}:8081"   # accessible uniquement depuis ce poste

volumes:
  mongo-data:
